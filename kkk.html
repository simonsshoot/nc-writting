<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVOLVE Benchmark Results</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #222; padding: 24px; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 16px; color: #111; }

  .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .ctrl-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ctrl-label { font-size: 13px; color: #666; min-width: 60px; }

  .tab-group { display: flex; gap: 8px; }
  button.tab {
    padding: 4px 14px; border-radius: 20px;
    border: 1.5px solid #ccc; background: transparent;
    color: #666; font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  button.tab.active-bench { background: #E24B4A; border-color: #E24B4A; color: #fff; }
  button.tab.active-metric { background: #444; border-color: #444; color: #fff; }

  .chart-wrap { position: relative; width: 100%; height: 420px; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: center; margin-top: 14px; font-size: 12px; color: #555;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>

<h2>Benchmark Results — EVOLVE vs. Baselines</h2>

<div class="controls">
  <div class="ctrl-row">
    <span class="ctrl-label">Benchmark:</span>
    <div class="tab-group" id="bench-tabs">
      <button class="tab active-bench" onclick="setBench('RJudge')">RJudge</button>
      <button class="tab" onclick="setBench('AsseBench')">AsseBench</button>
      <button class="tab" onclick="setBench('AgentHarm')">AgentHarm</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">Metric:</span>
    <div class="tab-group" id="metric-tabs">
      <button class="tab active-metric" onclick="setMetric('Acc')">Acc</button>
      <button class="tab" onclick="setMetric('Prec')">Prec</button>
      <button class="tab" onclick="setMetric('Rec')">Rec</button>
      <button class="tab" onclick="setMetric('F1')">F1</button>
    </div>
  </div>
</div>

<div class="chart-wrap">
  <canvas id="mainChart"></canvas>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-swatch" style="background:#E24B4A;"></span><b>EVOLVE</b> (ours)</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#9baac7;"></span>CoTSafe</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#a8c4a0;"></span>ShieldAgent</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#c4b8a0;"></span>AGrail</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#b8a0c4;"></span>GuardAgent</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA = {
  RJudge: {
    DeepSeek:  { CoTSafe:[0.8091,0.8575,0.7223,0.7815], ShieldAgent:[0.7863,0.7136,0.9934,0.8318], AGrail:[0.5403,0.6488,0.9168,0.7601], GuardAgent:[0.6935,0.7684,0.5037,0.6086], EVOLVE:[0.9107,0.8982,0.9148,0.9065] },
    'GPT-4o':  { CoTSafe:[0.6786,0.7560,0.4704,0.5804], ShieldAgent:[0.7863,0.7136,0.9934,0.8318], AGrail:[0.5494,0.4889,0.4933,0.4910], GuardAgent:[0.6848,0.8571,0.4000,0.5455], EVOLVE:[0.9002,0.9338,0.8916,0.9123] },
    Claude:    { CoTSafe:[0.8634,0.9288,0.7516,0.8309], ShieldAgent:[0.7863,0.7136,0.9934,0.8318], AGrail:[0.7916,0.7436,0.8625,0.7987], GuardAgent:[0.6856,0.7018,0.4513,0.5489], EVOLVE:[0.8841,0.9349,0.8385,0.8841] },
    Gemini:    { CoTSafe:[0.8021,0.8520,0.7037,0.7703], ShieldAgent:[0.7863,0.7136,0.9934,0.8318], AGrail:[0.7846,0.9077,0.5801,0.7072], GuardAgent:[0.6968,0.7904,0.4889,0.6042], EVOLVE:[0.9255,0.9257,0.9222,0.9240] }
  },
  AsseBench: {
    DeepSeek:  { CoTSafe:[0.6316,0.7629,0.8578,0.7722], ShieldAgent:[0.8046,0.8762,0.7532,0.8095], AGrail:[0.8678,0.9213,0.8039,0.8587], GuardAgent:[0.7259,0.6294,0.9240,0.7485], EVOLVE:[0.8868,0.8974,0.8430,0.8690] },
    'GPT-4o':  { CoTSafe:[0.4663,0.4776,0.7328,0.5781], ShieldAgent:[0.8046,0.8762,0.7532,0.8095], AGrail:[0.6924,0.9120,0.6344,0.7482], GuardAgent:[0.6184,0.6086,0.6609,0.6336], EVOLVE:[0.8633,0.9368,0.8420,0.8869] },
    Claude:    { CoTSafe:[0.7466,0.6967,0.8725,0.7746], ShieldAgent:[0.8046,0.8762,0.7532,0.8095], AGrail:[0.8152,0.7037,0.9209,0.7981], GuardAgent:[0.7143,0.6529,0.9314,0.7675], EVOLVE:[0.8802,0.9000,0.8529,0.8758] },
    Gemini:    { CoTSafe:[0.6242,0.4863,0.8211,0.6107], ShieldAgent:[0.8046,0.8762,0.7532,0.8095], AGrail:[0.8849,0.9062,0.8352,0.8692], GuardAgent:[0.7234,0.6585,0.9265,0.7684], EVOLVE:[0.8874,0.9136,0.8554,0.8834] }
  },
  AgentHarm: {
    DeepSeek:  { CoTSafe:[0.7666,0.9007,0.5978,0.6915], ShieldAgent:[0.5286,0.6923,0.1029,0.1791], AGrail:[0.6000,0.8214,0.3557,0.4964], GuardAgent:[0.7714,0.8992,0.6114,0.7281], EVOLVE:[0.8800,0.9346,0.8171,0.8719] },
    'GPT-4o':  { CoTSafe:[0.5857,0.6442,0.3829,0.4801], ShieldAgent:[0.5286,0.6923,0.1029,0.1791], AGrail:[0.5874,1.0000,0.1771,0.3009], GuardAgent:[0.5829,0.8222,0.2114,0.3362], EVOLVE:[0.8758,1.0000,0.8240,0.9035] },
    Claude:    { CoTSafe:[0.6543,1.0000,0.3086,0.4718], ShieldAgent:[0.5286,0.6923,0.1029,0.1791], AGrail:[0.5543,0.6479,0.2629,0.3741], GuardAgent:[0.7600,0.8897,0.6437,0.7467], EVOLVE:[0.8812,0.9854,0.8272,0.8994] },
    Gemini:    { CoTSafe:[0.7771,0.8392,0.6857,0.7547], ShieldAgent:[0.5286,0.6923,0.1029,0.1791], AGrail:[0.5457,0.9000,0.1029,0.1846], GuardAgent:[0.8333,0.9000,0.6171,0.7297], EVOLVE:[0.8886,0.9851,0.8468,0.9107] }
  }
};

const METHODS   = ['CoTSafe','ShieldAgent','AGrail','GuardAgent','EVOLVE'];
const BACKBONES = ['DeepSeek','GPT-4o','Claude','Gemini'];
const METRICS   = ['Acc','Prec','Rec','F1'];

const COLORS = {
  EVOLVE:      { bg: '#E24B4A', border: '#A32D2D' },
  CoTSafe:     { bg: '#9baac7', border: '#6a7fa0' },
  ShieldAgent: { bg: '#a8c4a0', border: '#7a9e72' },
  AGrail:      { bg: '#c4b8a0', border: '#96876b' },
  GuardAgent:  { bg: '#b8a0c4', border: '#8a6fa0' }
};

let currentBench  = 'RJudge';
let currentMetric = 'Acc';
let chart = null;

function getChartData() {
  const mi = METRICS.indexOf(currentMetric);
  return {
    labels: BACKBONES,
    datasets: METHODS.map(m => ({
      label: m,
      data: BACKBONES.map(b => parseFloat((DATA[currentBench][b][m][mi] * 100).toFixed(1))),
      backgroundColor: COLORS[m].bg + (m === 'EVOLVE' ? 'FF' : 'CC'),
      borderColor: COLORS[m].border,
      borderWidth: m === 'EVOLVE' ? 2.5 : 1,
      borderRadius: 4,
      borderSkipped: false,
    }))
  };
}

function buildChart() {
  const ctx = document.getElementById('mainChart');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'bar',
    data: getChartData(),
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => ` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}%`
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 13 }, color: '#666' }
        },
        y: {
          min: 0, max: 100,
          title: {
            display: true,
            text: currentMetric + ' (%)',
            font: { size: 13 }, color: '#666'
          },
          ticks: {
            callback: v => v + '%',
            font: { size: 12 }, color: '#666'
          },
          grid: { color: 'rgba(0,0,0,0.07)' }
        }
      },
      animation: { duration: 350 }
    }
  });
}

function setBench(b) {
  currentBench = b;
  document.querySelectorAll('#bench-tabs .tab').forEach(el => {
    el.classList.toggle('active-bench', el.textContent === b);
  });
  buildChart();
}

function setMetric(m) {
  currentMetric = m;
  document.querySelectorAll('#metric-tabs .tab').forEach(el => {
    el.classList.toggle('active-metric', el.textContent === m);
  });
  buildChart();
}

buildChart();
</script>
</body>
</html>
